<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Я тебя люблю — на всех языках мира</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at center, #2a0610 0%, #0c0105 70%, #050002 100%);
    font-family: "Segoe UI", "Noto Sans", system-ui, sans-serif;
    color: #ffd6e0;
    cursor: pointer;
  }
  canvas { display: block; }
  #tip {
    position: fixed;
    pointer-events: none;
    padding: 6px 10px;
    border-radius: 8px;
    background: rgba(20, 0, 8, .85);
    border: 1px solid rgba(255, 90, 130, .5);
    font-size: 13px;
    white-space: nowrap;
    opacity: 0;
    transition: opacity .15s;
    transform: translate(12px, 12px);
  }
  #tip b { color: #ff7a9c; }
  #hint {
    position: fixed;
    bottom: 14px;
    width: 100%;
    text-align: center;
    font-size: 13px;
    letter-spacing: .05em;
    color: rgba(255, 190, 210, .45);
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tip"></div>
<div id="hint">Нажмите, чтобы собрать сердце заново · наведите на слово, чтобы узнать язык</div>

<script>
const LOVE = [
  ["Русский", "Я тебя люблю"], ["English", "I love you"], ["Français", "Je t'aime"],
  ["Deutsch", "Ich liebe dich"], ["Español", "Te quiero"], ["Italiano", "Ti amo"],
  ["Português", "Eu te amo"], ["Українська", "Я тебе кохаю"], ["Беларуская", "Я цябе кахаю"],
  ["Polski", "Kocham cię"], ["Čeština", "Miluji tě"], ["Slovenčina", "Ľúbim ťa"],
  ["Български", "Обичам те"], ["Српски", "Волим те"], ["Hrvatski", "Volim te"],
  ["Slovenščina", "Ljubim te"], ["Македонски", "Те сакам"], ["Română", "Te iubesc"],
  ["Magyar", "Szeretlek"], ["Suomi", "Minä rakastan sinua"], ["Eesti", "Ma armastan sind"],
  ["Latviešu", "Es tevi mīlu"], ["Lietuvių", "Aš tave myliu"], ["Svenska", "Jag älskar dig"],
  ["Norsk", "Jeg elsker deg"], ["Dansk", "Jeg elsker dig"], ["Íslenska", "Ég elska þig"],
  ["Nederlands", "Ik hou van jou"], ["Afrikaans", "Ek is lief vir jou"], ["Ελληνικά", "Σ' αγαπώ"],
  ["Türkçe", "Seni seviyorum"], ["Azərbaycan", "Səni sevirəm"], ["Қазақша", "Мен сені сүйемін"],
  ["Oʻzbekcha", "Men seni sevaman"], ["Кыргызча", "Мен сени сүйөм"], ["Татарча", "Мин сине яратам"],
  ["Башҡортса", "Мин һине яратам"], ["Чӑвашла", "Эпӗ сана юрататӑп"], ["Тоҷикӣ", "Ман туро дӯст медорам"],
  ["Türkmençe", "Men seni söýýärin"], ["Монгол", "Би чамд хайртай"], ["ქართული", "მიყვარხარ"],
  ["Հայերեն", "Ես քեզ սիրում եմ"], ["עברית", "אני אוהב אותך"], ["العربية", "أحبك"],
  ["فارسی", "دوستت دارم"], ["اردو", "میں تم سے محبت کرتا ہوں"], ["हिन्दी", "मैं तुमसे प्यार करता हूँ"],
  ["বাংলা", "আমি তোমাকে ভালোবাসি"], ["ਪੰਜਾਬੀ", "ਮੈਂ ਤੈਨੂੰ ਪਿਆਰ ਕਰਦਾ ਹਾਂ"], ["ગુજરાતી", "હું તને પ્રેમ કરું છું"],
  ["मराठी", "मी तुझ्यावर प्रेम करतो"], ["தமிழ்", "நான் உன்னை காதலிக்கிறேன்"], ["తెలుగు", "నేను నిన్ను ప్రేమిస్తున్నాను"],
  ["ಕನ್ನಡ", "ನಾನು ನಿನ್ನನ್ನು ಪ್ರೀತಿಸುತ್ತೇನೆ"], ["മലയാളം", "ഞാൻ നിന്നെ സ്നേഹിക്കുന്നു"], ["සිංහල", "මම ඔයාට ආදරෙයි"],
  ["नेपाली", "म तिमीलाई माया गर्छु"], ["中文", "我爱你"], ["粵語", "我愛你"], ["日本語", "愛してる"],
  ["한국어", "사랑해요"], ["Tiếng Việt", "Anh yêu em"], ["ไทย", "ฉันรักเธอ"], ["ລາວ", "ຂ້ອຍຮັກເຈົ້າ"],
  ["ខ្មែរ", "ខ្ញុំស្រលាញ់អ្នក"], ["မြန်မာ", "ချစ်တယ်"], ["Bahasa Indonesia", "Aku cinta kamu"],
  ["Bahasa Melayu", "Saya cintakan awak"], ["Filipino", "Mahal kita"], ["Basa Jawa", "Aku tresna marang kowe"],
  ["Kiswahili", "Nakupenda"], ["አማርኛ", "እወድሻለሁ"], ["Yorùbá", "Mo nífẹ̀ẹ́ rẹ"], ["Igbo", "A hụrụ m gị n'anya"],
  ["Hausa", "Ina son ki"], ["isiZulu", "Ngiyakuthanda"], ["isiXhosa", "Ndiyakuthanda"], ["Soomaali", "Waan ku jeclahay"],
  ["Malagasy", "Tiako ianao"], ["Kinyarwanda", "Ndagukunda"], ["Shona", "Ndinokuda"], ["Lingála", "Nalingi yo"],
  ["Gaeilge", "Is breá liom tú"], ["Cymraeg", "Rwy'n dy garu di"], ["Gàidhlig", "Tha gaol agam ort"],
  ["Brezhoneg", "Da garout a ran"], ["Euskara", "Maite zaitut"], ["Català", "T'estimo"], ["Galego", "Quérote"],
  ["Shqip", "Të dua"], ["Malti", "Inħobbok"], ["Lëtzebuergesch", "Ech hunn dech gär"], ["Føroyskt", "Eg elski teg"],
  ["Esperanto", "Mi amas vin"], ["Latina", "Te amo"], ["Hawaiʻi", "Aloha au iā ʻoe"], ["Māori", "Ka nui taku aroha ki a koe"],
  ["Samoa", "Ou te alofa ia te oe"], ["Kreyòl ayisyen", "Mwen renmen ou"], ["Quechua", "Munakuyki"],
  ["Guaraní", "Rohayhu"], ["ייִדיש", "איך האָב דיך ליב"], ["Kurdî", "Ez te hez dikim"], ["پښتو", "زه تا سره مینه لرم"],
  ["ئۇيغۇرچە", "مەن سىزنى ياخشى كۆرىمەن"], ["བོད་ཡིག", "ང་ཁྱེད་རང་ལ་དགའ་པོ་ཡོད།"], ["Corsu", "Ti tengu caru"],
  ["Sardu", "Ti amo"], ["Frysk", "Ik hâld fan dy"], ["Tok Pisin", "Mi laikim yu"], ["Cebuano", "Gihigugma tika"]
];

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const tip = document.getElementById("tip");
let W, H, DPR, particles = [], start = 0, mouse = null;

// Классическая параметрическая кривая сердца
const heart = t => ({
  x: 16 * Math.sin(t) ** 3,
  y: -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) - 2.5
});

function buildSlots() {
  const unit = Math.min(W, H) / 38;
  const cx = W / 2, cy = H / 2;
  const slots = [];
  let idx = 0;
  const layers = [1, 0.88, 0.77, 0.67, 0.58, 0.5, 0.43];
  layers.forEach((s, li) => {
    const font = Math.max(9, unit * (0.62 - li * 0.035));
    ctx.font = `${font}px "Segoe UI", "Noto Sans", sans-serif`;
    // Сэмплируем кривую и считаем длину дуги
    const N = 1200, pts = [{ ...heart(0), d: 0 }];
    for (let i = 1; i <= N; i++) {
      const p = heart((i / N) * Math.PI * 2), q = pts[i - 1];
      pts.push({ ...p, d: q.d + Math.hypot((p.x - q.x) * s * unit, (p.y - q.y) * s * unit) });
    }
    const total = pts[N].d;
    // Сначала узнаём, сколько слов помещается, затем распределяем их равномерно
    const items = [];
    let used = 0;
    while (true) {
      const [lang, text] = LOVE[idx % LOVE.length];
      const w = ctx.measureText(text).width + font * 0.9;
      if (used + w > total) break;
      items.push({ lang, text, w });
      used += w;
      idx++;
    }
    const extra = (total - used) / Math.max(1, items.length);
    let d = 0, j = 0;
    items.forEach(it => {
      const mid = d + (it.w + extra) / 2;
      while (j < N && pts[j + 1].d < mid) j++;
      const a = pts[j], b = pts[Math.min(N, j + 1)];
      let ang = Math.atan2(b.y - a.y, b.x - a.x);
      if (ang > Math.PI / 2) ang -= Math.PI;
      if (ang < -Math.PI / 2) ang += Math.PI;
      slots.push({ ...it, font, layer: li, x: cx + a.x * s * unit, y: cy + a.y * s * unit, ang });
      d += it.w + extra;
    });
  });
  return { slots, cx, cy, unit };
}

let geo;
function layout(scatter) {
  DPR = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  geo = buildSlots();
  const old = particles;
  particles = geo.slots.map((s, i) => {
    const p = old[i];
    const r = Math.max(W, H) * (0.7 + Math.random() * 0.5), a = Math.random() * Math.PI * 2;
    const hue = 330 + Math.random() * 30 - s.layer * 2;
    return {
      ...s,
      sx: scatter || !p ? W / 2 + Math.cos(a) * r : p.cx,
      sy: scatter || !p ? H / 2 + Math.sin(a) * r : p.cy,
      sa: scatter || !p ? (Math.random() - 0.5) * 6 : p.ca,
      cx: 0, cy: 0, ca: 0,
      delay: scatter || !p ? (s.layer * 0.25 + Math.random() * 1.6) : 0,
      color: `hsl(${hue % 360}, ${85 + Math.random() * 15}%, ${58 + s.layer * 3 + Math.random() * 10}%)`
    };
  });
  start = performance.now();
}

const ease = t => 1 - Math.pow(1 - t, 3);

function frame(now) {
  const t = (now - start) / 1000;
  ctx.clearRect(0, 0, W, H);
  const arrived = t > 4.2;
  // Сердцебиение после того, как сердце собралось
  const beatT = arrived ? (t - 4.2) % 1.1 : 0;
  const beat = arrived ? 1 + 0.035 * Math.exp(-beatT * 7) * Math.sin(beatT * 18) ** 2 : 1;

  ctx.save();
  ctx.translate(geo.cx, geo.cy); ctx.scale(beat, beat); ctx.translate(-geo.cx, -geo.cy);
  ctx.textAlign = "center"; ctx.textBaseline = "middle";

  let hovered = null, best = 1e9;
  for (const p of particles) {
    const k = ease(Math.min(1, Math.max(0, (t - p.delay) / 1.8)));
    p.cx = p.sx + (p.x - p.sx) * k;
    p.cy = p.sy + (p.y - p.sy) * k;
    p.ca = p.sa + (p.ang - p.sa) * k;
    if (mouse) {
      const d = Math.hypot(mouse.x - p.cx, mouse.y - p.cy);
      if (d < p.w / 2 && d < best) { best = d; hovered = p; }
    }
    ctx.save();
    ctx.translate(p.cx, p.cy); ctx.rotate(p.ca);
    ctx.font = `${p.font}px "Segoe UI", "Noto Sans", sans-serif`;
    ctx.globalAlpha = 0.25 + 0.75 * k;
    ctx.fillStyle = p === hovered ? "#fff" : p.color;
    ctx.shadowColor = "rgba(255, 40, 90, .8)";
    ctx.shadowBlur = p === hovered ? 14 : 6;
    ctx.fillText(p.text, 0, 0);
    ctx.restore();
  }

  // Главная фраза в центре
  const ct = Math.min(1, Math.max(0, (t - 3.2) / 1.2));
  if (ct > 0) {
    ctx.globalAlpha = ct;
    ctx.font = `600 ${geo.unit * 1.25}px "Segoe UI", "Noto Sans", sans-serif`;
    ctx.fillStyle = "#fff0f4";
    ctx.shadowColor = "rgba(255, 30, 80, 1)";
    ctx.shadowBlur = 25;
    ctx.fillText("я тебя люблю", geo.cx, geo.cy);
  }
  ctx.restore();

  if (hovered) {
    tip.innerHTML = `<b>${hovered.lang}</b> — ${hovered.text}`;
    tip.style.left = mouse.x + "px"; tip.style.top = mouse.y + "px";
    tip.style.opacity = 1;
  } else tip.style.opacity = 0;

  requestAnimationFrame(frame);
}

canvas.addEventListener("mousemove", e => {
  mouse = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener("mouseleave", () => (mouse = null));
canvas.addEventListener("click", () => layout(true));
let rt;
addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => layout(false), 150); });

layout(true);
requestAnimationFrame(frame);
</script>
</body>
</html>
